oke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle data-hf-id="hf-x9yu" cx="6" cy="12" r="1" fill="currentColor"/><circle data-hf-id="hf-b6z5" cx="12" cy="12" r="1" fill="currentColor"/><circle data-hf-id="hf-k3zb" cx="18" cy="12" r="1" fill="currentColor"/></svg></span></span><span data-hf-id="hf-ebao" class="tw-ib"><svg data-hf-id="hf-w64n" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-gy5f" d="M4 12l16-8-5 16-3-7z"/><path data-hf-id="hf-t1bw" d="M12 13l8-9"/></svg></span></div></div></div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const blur = (p) => `blur(${p}px)`;
    const $ = (s) => document.querySelector(s);
    // layout position inside the Teams window (offsets ignore transforms, so the camera can be aimed before it moves)
    // the scene may be hidden when it is measured: lay it out for the moment of the reading, then put it back
    const laidOut = (el, fn) => { const off = []; for (let e = el; e; e = e.parentElement) if (getComputedStyle(e).display === "none") { off.push([e, e.style.display]); e.style.display = "block"; }
      try { return fn(); } finally { off.forEach(([e, d]) => { e.style.display = d; }); } };
    const box = (el, top) => laidOut(el, () => { let x = 0, y = 0, e = el; while (e && e !== top) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { x, y, w: el.offsetWidth, h: el.offsetHeight }; });
    const pos = (el, top) => box(el, top);
    // camera: put point (ax, ay) of el at screen (sx, sy) at scale S
    // values are functions: GSAP reads them when the scene first plays, once its layout exists
    const val = (v) => (typeof v === "function" ? v() : v);
    const focus = (win, el, S, sx = 960, sy = 540, ax = 0.5, ay = 0.5) => ({
      x: () => { const b = box(el, win); return sx - S * (b.x + val(ax) * b.w); }, y: () => { const b = box(el, win); return sy - S * (b.y + val(ay) * b.h); }, scale: S });
    // reveal a post down to y (the post grows as each item arrives, as Teams does)
    const clipAt = (post, y) => () => `inset(0px 0px ${Math.max(0, box(post).h - val(y))}px 0px round 8px)`;
    const below = (post, el, extra = 0) => () => pos(el, post).y + extra;
    // reveal.ts timing: typing 900, enter 220, expand 260, cursor 700, press 150, collapse 260, drop 220, badge 300, dim 600
    const dots = (sel, t) => document.querySelectorAll(sel + " .tw-dots i").forEach((d, i) =>
      tl.fromTo(d, { y: 0, opacity: 0.35 }, { keyframes: [{ y: -3, opacity: 1, duration: 0.18 }, { y: 0, opacity: 0.35, duration: 0.18 }], repeat: 1, immediateRender: false }, t + i * 0.15));

    const fw = $("#ak-f-win"), fpost = $("#ak-fpost"), qw = $("#ak-q-win"), card = $("#ak-card");
    tl.set([fw, qw], { transformOrigin: "0 0" }, 0);
    tl.set(["#ak-experts", "#ak-tree"], { opacity: 0 }, 0);
    tl.set("#ak-canvas", { x: -795, y: 94, scale: 1.35, transformOrigin: "0 0" }, 0);
    tl.set(fpost, { clipPath: clipAt(fpost, below(fpost, $("#ak-status"), -6)) , immediateRender: false }, 0);
    tl.set("#ak-status", { opacity: 0, y: 12 }, 0);
    tl.set("#ak-why", { opacity: 0 }, 0);
    tl.set(".tr-link.trail", { strokeDasharray: 400, strokeDashoffset: 400 }, 0);
    tl.set("#ak-tree .tr-leaf", { scale: 0 }, 0);
    tl.set(["#ak-tree .tr-cut", "#ak-tree .tr-why"], { opacity: 0, y: 30 }, 0);
    tl.set("#ak-pulse", { scale: 0, opacity: 0 }, 0);
    tl.set("#ak-ans", { opacity: 0 }, 0);
    const btn = $("#ak-o0");
    tl.set("#ak-cursor", { x: () => box(card).w - 28, y: 4, immediateRender: false }, 0);
    // #Faults: the window whips in wide, then the camera pushes in on the new incident
    tl.fromTo(fw, { x: 300, y: 0, scale: 1, filter: blur(14) }, { x: 0, filter: blur(0), duration: 0.5, ease: "expo.out" }, 0);
    const A1 = focus(fw, fpost, 2.1, 960, 470);
    tl.to(fw, { ...A1, duration: 0.7, ease: "power3.inOut" }, 0.6);
    // the status expands under it (260 ms), its chip pops, the reason follows
    tl.to(fpost, { clipPath: clipAt(fpost, () => box(fpost).h), duration: 0.26, ease: "expo.out" }, 1.4);
    tl.to("#ak-status", { opacity: 1, y: 0, duration: 0.22, ease: "expo.out" }, 1.4);
    tl.fromTo("#ak-chip", { scale: 0.4 }, { keyframes: [{ scale: 1.15, duration: 0.24 }, { scale: 1, duration: 0.16 }], immediateRender: false }, 1.6);
    tl.to("#ak-why", { opacity: 1, duration: 0.3 }, 2.0);
    tl.to(fw, { y: () => A1.y() - 24, duration: 0.9, ease: "none" }, 2.0);
    // Lift into the tree: zoom through
    tl.to("#ak-faults", { scale: 1.15, opacity: 0, filter: blur(12), duration: 0.35, ease: "power2.in" }, 2.9);
    tl.fromTo("#ak-tree", { scale: 0.88, filter: blur(12) }, { scale: 1, opacity: 1, filter: blur(0), duration: 0.45, ease: "power3.out", immediateRender: false }, 3.27);
